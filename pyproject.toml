[project]
name = "micromouse"
version = "0.1.0"
description = "Micromouse 16x16 maze challenge: simulator, pluggable bots, RL agents and a race dashboard"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0",
]

[project.optional-dependencies]
rl = ["torch>=2.2"]
dash = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[project.scripts]
micromouse = "micromouse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/micromouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
